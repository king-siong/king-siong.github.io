<!-- <a href="/blog/2022/11/20/%E7%A7%8B%E6%97%A5%E9%9B%9C%E6%96%87/-v.html">test</a> -->

<p>在牀上關掉閙鈴時，學期已過半。</p>

<p>九月入校，想起自己已是大四，「資歴」頗深。</p>

<p>特地地從家裏帶來件花衬衫，還得必須穿雙拖鞋去食堂打飯。閒來若無事，得出門泡泡水，再整輛破爛的桑塔納三千，走在學校，腳下如似生風。</p>

<p>可我還拿著從未補辦過的蓝色校園卡，頭髮也無電燙過，說著不同的話，做著同樣的事，一切，恍如昨日。</p>

<p>痛苦，總是自我折磨所致。曾經想勾勒完美人生，現今，我猶在泥淖，復何求？</p>

<p>我找不到的真正的自我，或許本就不存在！</p>
