        <time datetime="2023-01-08 00:00:00 +0000">January  8, 2023</time>

    <p>臘月十五居家煩悶，同<u>港</u>驅車外出散心，至加羅嶼。行至高處有一觀景臺，可見所謂加羅嶼者，潮漲則與陸隔離，其名之為嶼乎？</p>

<p>折步而下，由一風車處下至海滩。此處有巨石高耸，其為風海所蝕者有多處，自此可見夕陽餘暉。</p>

<p>盤石而上，空曠而大風，可見捕魚者，二三子。停少時，無他，故折返。天色漸晚，高臺可見紫雲圓月，別有一番風味。</p>

<p>景所以悅目者，從心也。然何去耶？現世、心境，難同一也。</p>
